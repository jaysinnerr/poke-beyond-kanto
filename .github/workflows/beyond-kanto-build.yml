name: Beyond Kanto Playable Patch

on:
  push:
    branches: [ beyond-kanto ]

jobs:
  build-playable-patch:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout Beyond Kanto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout agbcc
        uses: actions/checkout@master
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev mgba-sdl xvfb

      - name: Install agbcc into Beyond Kanto
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: ./agbcc

      - name: Build Pokémon Beyond Kanto
        run: |
          make -j$(nproc) all
          cp pokefirered.gba /tmp/pokefirered-beyond-kanto.gba

      - name: Emulator boot smoke test
        run: |
          set +e
          SDL_AUDIODRIVER=dummy timeout 12s xvfb-run -a mgba /tmp/pokefirered-beyond-kanto.gba
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            echo "mGBA exited unexpectedly with status $STATUS"
            exit "$STATUS"
          fi
          echo "mGBA stayed alive through the boot smoke window."

      - name: Build clean FireRed v1.0 reference
        run: |
          git worktree add /tmp/pokefirered-base master
          (cd agbcc && ./install.sh /tmp/pokefirered-base)
          cd /tmp/pokefirered-base
          make -j$(nproc) all
          cp pokefirered.gba /tmp/pokefirered-base.gba

      - name: Verify exact FireRed v1.0 base
        run: |
          BASE_SHA=$(sha1sum /tmp/pokefirered-base.gba | awk '{print $1}')
          echo "Base SHA1: $BASE_SHA"
          test "$BASE_SHA" = "41cb23d8dccc8ebd7c649cd8fbb58eeace6e2fdc"

      - name: Create playable IPS patch
        run: |
          python3 tools/make_ips.py             /tmp/pokefirered-base.gba             /tmp/pokefirered-beyond-kanto.gba             pokemon-beyond-kanto.ips
          ls -lh pokemon-beyond-kanto.ips

      - name: Upload Beyond Kanto patch
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-beyond-kanto-playable-patch
          path: pokemon-beyond-kanto.ips
          if-no-files-found: error
